<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonaCore 管理面板</title>
<style>
  :root {
    --bg:#f5f6f8; --card:#fff; --primary:#3b6ef5; --text:#1f2329; --muted:#8a919c;
    --pass:#1a9c5b; --fail:#d64545; --pending:#d98a1f; --grid:#e7eaf0; --ink:#5b6470;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:980px; margin:0 auto; padding:24px 16px; }
  h1 { font-size:20px; margin:0 0 16px; }
  .card { background:var(--card); border-radius:12px; padding:20px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
  .login { max-width:360px; margin:10vh auto; }
  .login input { width:100%; padding:12px; border:1px solid #d5d9e0; border-radius:8px; font-size:15px; margin-bottom:10px; }
  button { padding:10px 18px; border:none; border-radius:8px; background:var(--primary); color:#fff; font-size:14px; cursor:pointer; }
  button.ghost { background:#eef1f6; color:var(--text); }
  .toolbar { display:flex; gap:8px; margin-bottom:14px; justify-content:space-between; align-items:center; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:left; padding:10px 12px; border-bottom:1px solid #eef0f3; }
  th { color:var(--muted); font-weight:500; }
  tr.row { cursor:pointer; }
  tr.row:hover { background:#f7f9fc; }
  .tag { display:inline-block; padding:2px 10px; border-radius:20px; font-size:12px; color:#fff; }
  .tag.pass { background:var(--pass); } .tag.fail { background:var(--fail); } .tag.pending { background:var(--pending); }
  .err { color:var(--fail); font-size:13px; margin-top:8px; }
  .hint { color:var(--muted); text-align:center; padding:40px 0; }

  /* 详情 */
  .detail-grid { display:flex; flex-wrap:wrap; gap:24px; align-items:center; }
  .radar-box { flex:0 0 340px; }
  .radar-box svg { width:100%; height:auto; display:block; }
  .score-box { flex:1; min-width:280px; }
  .hero { display:flex; align-items:baseline; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .hero-num { font-size:40px; font-weight:700; line-height:1; }
  .hero-label { color:var(--muted); font-size:13px; }
  .bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
  .bar-name { width:76px; font-size:13px; flex-shrink:0; text-align:right; }
  .bar-track { flex:1; height:10px; background:#eef0f3; border-radius:5px; overflow:hidden; }
  .bar-fill { height:100%; border-radius:5px; }
  .bar-score { width:34px; font-size:13px; color:var(--ink); font-weight:600; }
  pre { white-space:pre-wrap; word-break:break-word; font-size:13px; line-height:1.6; background:#fafbfc; border-radius:8px; padding:16px; margin:16px 0 0; }
</style>
</head>
<body>
<div class="wrap">
  <!-- 登录 -->
  <div id="login" class="card login">
    <h1>PersonaCore 管理面板</h1>
    <input type="password" id="pwd" placeholder="管理员密码" onkeydown="if(event.key==='Enter')login()">
    <button onclick="login()">登录</button>
    <div id="loginErr" class="err"></div>
  </div>

  <!-- 面板 -->
  <div id="dash" style="display:none">
    <!-- 列表 -->
    <div id="listView">
      <div class="toolbar">
        <h1>候选人列表</h1>
        <div><button class="ghost" onclick="load()">刷新</button> <button onclick="logout()">退出</button></div>
      </div>
      <div class="card">
        <table>
          <thead><tr><th>#</th><th>时间</th><th>综合分</th><th>结论</th><th>达标维度</th></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div id="empty" class="hint">暂无面试记录</div>
      </div>
    </div>

    <!-- 详情 -->
    <div id="detailView" style="display:none">
      <div class="toolbar">
        <button class="ghost" onclick="back()">← 返回列表</button>
      </div>
      <div class="card">
        <div class="detail-grid">
          <div class="radar-box" id="radarBox"></div>
          <div class="score-box">
            <div class="hero">
              <span class="hero-num" id="heroNum"></span>
              <span class="hero-label">综合分 / 5</span>
              <span id="heroTag" class="tag"></span>
            </div>
            <div id="bars"></div>
          </div>
        </div>
      </div>
      <pre id="report" style="display:none"></pre>
    </div>
  </div>
</div>

<script>
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

let list = [];

async function checkAuth(){
  try{
    const res=await fetch('/admin/api/candidates');
    if(res.ok){
      document.getElementById('login').style.display='none';
      document.getElementById('dash').style.display='block';
      render(await res.json());
    }
  }catch(e){}
}

async function login(){
  const pwd=document.getElementById('pwd').value;
  const res=await fetch('/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pwd})});
  if(!res.ok){document.getElementById('loginErr').textContent='密码错误';return;}
  document.getElementById('login').style.display='none';
  document.getElementById('dash').style.display='block';
  load();
}

async function logout(){
  try{ await fetch('/admin/logout',{method:'POST'}); }catch(e){}
  location.reload();
}

async function load(){
  const res=await fetch('/admin/api/candidates');
  if(res.status===401){ location.reload(); return; }
  list=await res.json();
  render(list);
}

function render(list){
  const tbody=document.getElementById('tbody');
  const empty=document.getElementById('empty');
  tbody.innerHTML='';
  empty.style.display=list.length?'none':'block';
  list.forEach(c=>{
    const tr=document.createElement('tr');
    tr.className='row';
    const tag=c.decision==='通过'?'pass':(c.decision==='淘汰'?'fail':'pending');
    const dims=c.dimensions||[];
    const passed=dims.filter(d=>d.passed).length;
    tr.innerHTML=`<td>${c.id}</td><td>${esc(c.started_at||'')}</td><td>${c.composite!=null?c.composite.toFixed(2):'-'}</td>`+
      `<td><span class="tag ${tag}">${esc(c.decision)}</span></td><td class="dim">${passed}/${dims.length}</td>`;
    tr.onclick=()=>view(c);
    tbody.appendChild(tr);
  });
}

// 雷达图（纯 SVG，无外部依赖）
function renderRadar(dims, scaleMax=5){
  const W=380, H=320, cx=190, cy=155, R=95;
  const n=dims.length;
  const ang=i=>-Math.PI/2 + i*(2*Math.PI/n);
  const pt=(i,r)=>[cx+r*Math.cos(ang(i)), cy+r*Math.sin(ang(i))];
  let s=`<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">`;

  // 网格环 + 轴线
  for(let lv=1;lv<=scaleMax;lv++){
    const r=lv/scaleMax*R;
    const pts=dims.map((_,i)=>pt(i,r).join(',')).join(' ');
    s+=`<polygon points="${pts}" fill="none" stroke="${lv===scaleMax?'#d5d9e0':'#e7eaf0'}" stroke-width="1"/>`;
  }
  dims.forEach((_,i)=>{
    const [x,y]=pt(i,R);
    s+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e7eaf0" stroke-width="1"/>`;
  });

  // 分数多边形 + 顶点
  const scorePts=dims.map((d,i)=>{
    const r=Math.max(0,Math.min(1,(d.score||0)/scaleMax))*R;
    return pt(i,r).join(',');
  }).join(' ');
  s+=`<polygon points="${scorePts}" fill="rgba(59,110,245,0.18)" stroke="#3b6ef5" stroke-width="2"/>`;
  dims.forEach((d,i)=>{
    const r=Math.max(0,Math.min(1,(d.score||0)/scaleMax))*R;
    const [x,y]=pt(i,r);
    s+=`<circle cx="${x}" cy="${y}" r="3" fill="#3b6ef5"/>`;
  });

  // 标签：维度名 + 分数
  dims.forEach((d,i)=>{
    const [x1,y1]=pt(i,R+22);
    const [x2,y2]=pt(i,R+38);
    s+=`<text x="${x1}" y="${y1}" text-anchor="middle" font-size="12" fill="#5b6470">${esc(d.name)}</text>`;
    s+=`<text x="${x2}" y="${y2}" text-anchor="middle" font-size="11" fill="#8a919c">${(d.score||0).toFixed(1)}</text>`;
  });
  s+=`</svg>`;
  return s;
}

function renderBars(dims, scaleMax=5){
  return dims.map(d=>{
    const pct=Math.max(0,Math.min(100,(d.score||0)/scaleMax*100));
    const color=d.passed?'#1a9c5b':'#d64545';
    return `<div class="bar-row">
      <span class="bar-name">${esc(d.name)}</span>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
      <span class="bar-score">${(d.score||0).toFixed(1)}</span>
    </div>`;
  }).join('');
}

async function view(c){
  document.getElementById('listView').style.display='none';
  document.getElementById('detailView').style.display='block';
  const dims=c.dimensions||[];
  document.getElementById('radarBox').innerHTML=renderRadar(dims);
  document.getElementById('bars').innerHTML=renderBars(dims);
  document.getElementById('heroNum').textContent=c.composite!=null?c.composite.toFixed(2):'-';
  const tag=c.decision==='通过'?'pass':(c.decision==='淘汰'?'fail':'pending');
  const tg=document.getElementById('heroTag');
  tg.className='tag '+tag; tg.textContent=c.decision;
  // 拉完整报告
  const rp=document.getElementById('report');
  rp.style.display='none';
  try{
    const res=await fetch('/admin/api/candidates/'+c.id);
    const rec=await res.json();
    rp.textContent=rec.report_md||'（无报告）';
    rp.style.display='block';
  }catch(e){}
  window.scrollTo({top:0});
}

function back(){
  document.getElementById('detailView').style.display='none';
  document.getElementById('listView').style.display='block';
}

checkAuth();
</script>
</body>
</html>
