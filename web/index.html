<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PersonaCore 性格测评</title>
<style>
  :root {
    --bg: #f5f6f8; --card: #ffffff; --primary: #3b6ef5; --ai: #eef1f6;
    --me: #3b6ef5; --text: #1f2329; --muted: #8a919c; --red: #f04a4a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex;
    flex-direction: column; align-items: center;
  }
  .container { width: 100%; max-width: 720px; height: 100%; display: flex; flex-direction: column; padding: 16px; gap: 12px; }

  /* 欢迎页 */
  .welcome { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; text-align: center; }
  .welcome h1 { font-size: 26px; margin: 0; }
  .welcome .logo { font-size: 52px; }
  .welcome .sub { color: var(--muted); font-size: 15px; margin: 0; max-width: 400px; line-height: 1.7; }

  /* 聊天区 */
  .chat { flex: 1; overflow-y: auto; background: var(--card); border-radius: 12px; padding: 16px; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .msg { margin-bottom: 14px; display: flex; flex-direction: column; }
  .msg .role { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
  .msg p { margin: 0; padding: 10px 12px; border-radius: 10px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; max-width: 85%; }
  .msg.ai { align-items: flex-start; }
  .msg.ai p { background: var(--ai); }
  .msg.me { align-items: flex-end; }
  .msg.me p { background: var(--me); color: #fff; }

  /* 语音气泡（微信风格：波形 + 时长） */
  .msg.voice p { display: flex; align-items: center; gap: 8px; min-width: 68px; }
  .v-wave { display: flex; align-items: center; gap: 2px; height: 18px; }
  .v-wave span { width: 2px; background: #fff; border-radius: 1px; }
  .v-wave span:nth-child(1){height:6px}.v-wave span:nth-child(2){height:12px}
  .v-wave span:nth-child(3){height:17px}.v-wave span:nth-child(4){height:9px}
  .v-wave span:nth-child(5){height:14px}.v-wave span:nth-child(6){height:5px}
  .v-dur { font-size: 12px; }

  /* 录音动效 */
  .rec-indicator {
    display: none; align-items: center; justify-content: center; gap: 12px;
    background: var(--card); border-radius: 12px; padding: 14px;
    box-shadow: 0 1px 6px rgba(0,0,0,.08);
  }
  .rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); animation: blink 1s infinite; }
  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.2} }
  .rec-wave { display: flex; align-items: center; gap: 3px; height: 28px; }
  .rec-wave span { width: 3px; background: var(--primary); border-radius: 2px; animation: wave 1s ease-in-out infinite; }
  .rec-wave span:nth-child(1){height:8px;animation-delay:0s}
  .rec-wave span:nth-child(2){height:20px;animation-delay:.1s}
  .rec-wave span:nth-child(3){height:28px;animation-delay:.2s}
  .rec-wave span:nth-child(4){height:14px;animation-delay:.3s}
  .rec-wave span:nth-child(5){height:24px;animation-delay:.4s}
  .rec-wave span:nth-child(6){height:10px;animation-delay:.5s}
  .rec-wave span:nth-child(7){height:20px;animation-delay:.6s}
  @keyframes wave { 0%,100%{transform:scaleY(.35)} 50%{transform:scaleY(1)} }
  .rec-time { font-size: 14px; color: var(--red); min-width: 30px; }
  .rec-hint { font-size: 13px; color: var(--muted); }

  .input-row { display: flex; gap: 8px; align-items: center; }
  .input-row input { flex: 1; padding: 12px; border: 1px solid #d5d9e0; border-radius: 8px; font-size: 15px; }
  button { padding: 11px 18px; border: none; border-radius: 8px; background: var(--primary); color: #fff; font-size: 15px; cursor: pointer; }
  button:disabled { background: #b9c4e6; cursor: not-allowed; }
  .mic-btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 20px; flex-shrink: 0; }
  .mic-btn.recording { background: var(--red); }
  .report { display: none; background: var(--card); border-radius: 12px; padding: 16px; overflow: auto; white-space: pre-wrap; font-size: 13px; line-height: 1.6; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
</style>
</head>
<body>
<div class="container">
  <div id="welcome" class="welcome">
    <div class="logo">🧑‍💼</div>
    <h1>PersonaCore · 性格特质测评</h1>
    <p class="sub">基于大五人格（OCEAN）的多智能体面试测评，回答几个问题，即可生成你的性格特质报告。</p>
    <button id="startBtn" onclick="start()">开始面试</button>
  </div>

  <div id="chat" class="chat" style="display:none"></div>

  <!-- 录音动效 -->
  <div id="recIndicator" class="rec-indicator">
    <span class="rec-dot"></span>
    <div class="rec-wave"><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
    <span id="recTime" class="rec-time">0″</span>
    <span class="rec-hint">正在录音，点击麦克风结束</span>
  </div>

  <div id="inputRow" class="input-row" style="display:none">
    <input id="msgInput" placeholder="输入你的回答，回车发送…">
    <button id="recBtn" class="mic-btn" onclick="toggleRec()" title="语音回答">🎤</button>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>

  <button id="reportBtn" style="display:none" onclick="showReport()">查看报告</button>
  <div id="report" class="report"></div>
</div>

<script>
let sessionId = null;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function addMsg(role, text) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg ' + (role === '候选人' ? 'me' : 'ai');
  div.innerHTML = '<span class="role">' + esc(role) + '</span><p>' + esc(text) + '</p>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

// 微信风格语音气泡
function addVoiceMsg(duration) {
  const chat = document.getElementById('chat');
  const div = document.createElement('div');
  div.className = 'msg me voice';
  const bars = '<span></span><span></span><span></span><span></span><span></span><span></span>';
  div.innerHTML = '<span class="role">候选人</span><p><span class="v-wave">' + bars + '</span><span class="v-dur">' + duration + '″</span></p>';
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function start() {
  const btn = document.getElementById('startBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/interview/start', { method: 'POST' });
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    sessionId = data.session_id;
    document.getElementById('welcome').style.display = 'none';
    document.getElementById('chat').style.display = 'block';
    document.getElementById('inputRow').style.display = 'flex';
    data.messages.forEach(m => addMsg('面试官', m));
    document.getElementById('msgInput').focus();
  } catch (e) {
    alert('启动失败：' + e.message);
    btn.disabled = false;
  }
}

function finishFlow(data) {
  addMsg('面试官', data.message);
  if (data.finished) {
    document.getElementById('inputRow').style.display = 'none';
    document.getElementById('reportBtn').style.display = 'inline-block';
    addMsg('系统', '面试已结束，点击「查看报告」生成你的测评报告。');
  }
}

async function send() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  addMsg('候选人', text);
  const fd = new FormData();
  fd.append('message', text);
  await submit(fd);
}

async function submit(fd) {
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  try {
    const res = await fetch('/interview/' + sessionId + '/message', { method: 'POST', body: fd });
    if (!res.ok) throw new Error(await res.text());
    finishFlow(await res.json());
  } catch (e) {
    addMsg('系统', '出错了：' + e.message);
  } finally {
    btn.disabled = false;
  }
}

// —— 录音 ——
let mediaRecorder = null, audioChunks = [], recStream = null;
let recStartTime = null, recTimer = null;

async function toggleRec() {
  const btn = document.getElementById('recBtn');
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    stopRec();
    return;
  }
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    mediaRecorder = new MediaRecorder(recStream);
    audioChunks = [];
    mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
    mediaRecorder.onstop = () => {
      recStream.getTracks().forEach(t => t.stop());
      const dur = Math.max(1, Math.round((Date.now() - recStartTime) / 1000));
      const blob = new Blob(audioChunks, { type: mediaRecorder.mimeType || 'audio/webm' });
      addVoiceMsg(dur);
      const fd = new FormData();
      fd.append('audio', blob, 'answer.webm');
      submit(fd);
    };
    mediaRecorder.start();
    recStartTime = Date.now();

    // 显示录音动效
    document.getElementById('recIndicator').style.display = 'flex';
    btn.classList.add('recording');
    btn.textContent = '⏹';
    document.getElementById('msgInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
    document.getElementById('recTime').textContent = '0″';
    recTimer = setInterval(() => {
      const s = Math.round((Date.now() - recStartTime) / 1000);
      document.getElementById('recTime').textContent = s + '″';
    }, 300);
  } catch (e) {
    addMsg('系统', '无法录音：' + e.message);
  }
}

function stopRec() {
  if (recTimer) { clearInterval(recTimer); recTimer = null; }
  mediaRecorder.stop();
  document.getElementById('recIndicator').style.display = 'none';
  const btn = document.getElementById('recBtn');
  btn.classList.remove('recording');
  btn.textContent = '🎤';
  document.getElementById('msgInput').disabled = false;
  document.getElementById('sendBtn').disabled = false;
}

async function showReport() {
  const btn = document.getElementById('reportBtn');
  btn.disabled = true;
  btn.textContent = '生成中…';
  try {
    const res = await fetch('/interview/' + sessionId + '/report');
    if (!res.ok) throw new Error(await res.text());
    const data = await res.json();
    const report = document.getElementById('report');
    report.textContent = data.markdown;
    report.style.display = 'block';
    btn.style.display = 'none';
  } catch (e) {
    addMsg('系统', '生成报告失败：' + e.message);
    btn.disabled = false;
    btn.textContent = '查看报告';
  }
}

document.getElementById('msgInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
</body>
</html>
