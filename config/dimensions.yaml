# 大五人格（Big Five / OCEAN）维度定义、行为锚点与结构化面试题库
# 各维度权重、合格线(threshold)、一票否决(veto) 可由管理员按企业要求调整

dimensions:
  - key: conscientiousness
    name: 尽责性
    bigfive: C
    anchors:
      positive: [计划性, 兑现承诺, 对细节负责, 主动复盘, 可靠交付]
      negative: [推卸责任, 模糊承诺, 拖延, 无时间观念, 敷衍了事]
    questions:
      - "请讲一件你需要同时处理多项任务、且都有明确截止时间的事。你是怎么安排优先级、确保按时完成的？"
      - "请举一个你曾经因为疏忽或拖延差点出问题的例子，后来你是怎么补救、并避免再犯的？"

  - key: agreeableness
    name: 宜人性
    bigfive: A
    anchors:
      positive: [协作分工, 倾听他人, 化解冲突, 共享荣誉, 体谅他人]
      negative: [独占功劳, 贬低同事, 拒绝合作, 固执己见, 冷漠]
    questions:
      - "请描述一次你和同事意见严重分歧的场景。你是怎么处理的，最后结果如何？"
      - "讲一次你需要依赖别人、或别人依赖你才能完成任务的合作经历，你们是怎么分工和配合的？"

  - key: emotional_stability
    name: 情绪稳定性
    bigfive: "N(反向)"
    anchors:
      positive: [压力下保持策略性, 不情绪化, 快速恢复, 客观归因, 情绪自控]
      negative: [崩溃, 抱怨, 归因外部, 回避, 易怒/焦虑]
    questions:
      - "请讲一次你面临很大压力或突发变故的时刻。你当时的反应是什么，后来是怎么调整、走出来的？"
      - "请举一个你被批评、或项目失败/搞砸的例子。你当时是怎么应对情绪、并处理这件事的？"

  - key: extraversion
    name: 外向性
    bigfive: E
    anchors:
      positive: [主动发起, 带动他人, 积极表达, 能量充沛, 乐于沟通]
      negative: [被动, 回避社交, 沉默寡言, 消极, 退缩]
    questions:
      - "请描述一次你主动发起或推动一件事、并带动他人一起参与的经历。"
      - "在团队里遇到冷场、或需要有人站出来时，你通常会怎么做？请举个具体例子。"

  - key: openness
    name: 开放性
    bigfive: O
    anchors:
      positive: [接受新想法, 好奇, 适应变化, 创新, 乐于学习]
      negative: [僵化, 抗拒变化, 思维封闭, 固守旧法, 排斥异见]
    questions:
      - "请讲一次你主动学习新东西、或尝试一个全新做法并取得效果的例子。"
      - "请描述一次你原本的方案被推翻、需要接受全新思路的情况，你是怎么调整的？"

# 默认评分与筛选规则（管理员可覆盖到每个维度）
defaults:
  scale_min: 1
  scale_max: 5
  weight: 0.2          # 各维度默认权重（综合分 = Σ 维度分 × 权重 / Σ 权重）
  threshold: 3.0       # 合格线
  veto: false          # 是否一票否决
  max_probes: 2        # 每个维度最多追问次数
